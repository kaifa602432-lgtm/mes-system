<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MES - Dashboard OEE Hiệu Suất Thiết Bị</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/i18n.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 space-y-6">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Header & Menu Điều Hướng & Đổi Ngôn Ngữ -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
      <div>
        <h1 data-i18n="oee_header_title" class="text-xl font-black text-cyan-400">📊 DASHBOARD HIỆU SUẤT THIẾT BỊ TỔNG THỂ (OEE)</h1>
        <p data-i18n="oee_header_sub" class="text-xs text-slate-400">Giám sát thời gian thực 14 thiết bị: Sẵn sàng (A), Tốc độ (P), Chất lượng (Q)</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-700 px-3 py-1.5 rounded-xl mr-2">
          <span class="text-xs">🌐</span>
          <select id="langSelect" onchange="setLanguage(this.value)" class="bg-transparent text-xs text-white font-bold outline-none cursor-pointer">
            <option value="vi" class="bg-slate-900 text-white">🇻🇳 Tiếng Việt</option>
            <option value="en" class="bg-slate-900 text-white">🇬🇧 English</option>
            <option value="zh" class="bg-slate-900 text-white">🇹🇼 繁體中文</option>
          </select>
        </div>

        <a href="/" data-i18n="nav_create_wo" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-3.5 py-2 rounded-xl transition">🏠 Phát Lệnh</a>
        <a href="/analytics.html" data-i18n="nav_analytics" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-3.5 py-2 rounded-xl transition">📈 Phân Tích & APS</a>
        <a href="/master-data.html" data-i18n="nav_master" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-3.5 py-2 rounded-xl transition">📦 Dữ Liệu Gốc & BOM</a>
      </div>
    </div>

    <!-- 4 Khối Chỉ Số Tổng Thể -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
        <span data-i18n="card_overall_oee" class="text-xs text-slate-400 block">OEE Toàn Xưởng</span>
        <b id="avgOee" class="text-2xl font-black text-cyan-400">88%</b>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
        <span data-i18n="card_running_mc" class="text-xs text-slate-400 block">Máy Đang Chạy</span>
        <b id="runningCount" class="text-2xl font-black text-emerald-400">0</b>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
        <span data-i18n="card_idle_mc" class="text-xs text-slate-400 block">Máy Chờ / Nghỉ</span>
        <b id="idleCount" class="text-2xl font-black text-amber-400">14</b>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
        <span data-i18n="card_breakdown_mc" class="text-xs text-slate-400 block">Máy Sự Cố Dừng</span>
        <b id="breakdownCount" class="text-2xl font-black text-rose-400">0</b>
      </div>
    </div>

    <!-- Danh sách thẻ máy móc theo từng phân xưởng -->
    <div id="machinesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </div>

  <script>
    const API_BASE = '/api';

    async function loadOeeData() {
      try {
        const res = await fetch(`${API_BASE}/dashboard/oee`);
        const result = await res.json();
        const grid = document.getElementById('machinesGrid');
        grid.innerHTML = '';

        if (result.data) {
          let totalOee = 0;
          let running = 0, idle = 0, breakdown = 0;

          result.data.forEach(m => {
            totalOee += m.oee;
            if (m.current_status === 'RUNNING') running++;
            else if (m.current_status === 'BREAKDOWN') breakdown++;
            else idle++;

            const statusColor = m.current_status === 'RUNNING' 
              ? 'bg-emerald-950 text-emerald-300 border-emerald-700'
              : (m.current_status === 'BREAKDOWN' ? 'bg-rose-950 text-rose-300 border-rose-700 animate-pulse' : 'bg-slate-800 text-slate-400 border-slate-700');

            grid.innerHTML += `
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
                <div class="flex justify-between items-start">
                  <div>
                    <b class="text-sm text-white">${m.machine_name}</b>
                    <span class="text-[11px] text-slate-400 block font-mono">${m.machine_id} - ${m.department}</span>
                  </div>
                  <span class="px-2 py-0.5 rounded text-[10px] border font-bold ${statusColor}">${m.current_status}</span>
                </div>

                <div class="flex items-baseline justify-between border-y border-slate-800/80 py-3">
                  <span class="text-xs text-slate-400">Chỉ số OEE:</span>
                  <span class="text-xl font-black ${m.oee >= 85 ? 'text-emerald-400' : 'text-amber-400'}">${m.oee}%</span>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                  <div class="bg-slate-950 p-2 rounded-lg">
                    <span class="text-[10px] text-slate-500 block">Sẵn Sàng (A)</span>
                    <b class="text-slate-300">${m.availability}%</b>
                  </div>
                  <div class="bg-slate-950 p-2 rounded-lg">
                    <span class="text-[10px] text-slate-500 block">Hiệu Suất (P)</span>
                    <b class="text-slate-300">${m.performance}%</b>
                  </div>
                  <div class="bg-slate-950 p-2 rounded-lg">
                    <span class="text-[10px] text-slate-500 block">Chất Lượng (Q)</span>
                    <b class="text-slate-300">${m.quality}%</b>
                  </div>
                </div>
              </div>
            `;
          });

          document.getElementById('avgOee').innerText = `${Math.round(totalOee / result.data.length)}%`;
          document.getElementById('runningCount').innerText = running;
          document.getElementById('idleCount').innerText = idle;
          document.getElementById('breakdownCount').innerText = breakdown;
        }
      } catch (e) {
        console.error(e);
      }
    }

    loadOeeData();
    setInterval(loadOeeData, 5000);
  </script>
</body>
</html>
