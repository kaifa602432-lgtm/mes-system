<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MES - Trạm Quét QR Thao Tác Xưởng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/i18n.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 space-y-6">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header & Menu Điều Hướng & Đổi Ngôn Ngữ -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
      <div>
        <h1 data-i18n="op_header_title" class="text-xl font-black text-cyan-400">📱 TRẠM QUÉT QR & THAO TÁC CÔNG ĐOẠN XƯỞNG</h1>
        <p data-i18n="op_header_sub" class="text-xs text-slate-400">Dành cho công nhân đứng máy cập nhật sản lượng OK / NG và kích hoạt ANDON</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-700 px-3 py-1.5 rounded-xl mr-2">
          <span class="text-xs">🌐</span>
          <select id="langSelect" onchange="handleLangSwitch(this.value)" class="bg-transparent text-xs text-white font-bold outline-none cursor-pointer">
            <option value="vi" class="bg-slate-900 text-white">🇻🇳 Tiếng Việt</option>
            <option value="en" class="bg-slate-900 text-white">🇬🇧 English</option>
            <option value="zh" class="bg-slate-900 text-white">🇹🇼 繁體中文</option>
          </select>
        </div>

        <a href="/" data-i18n="nav_create_wo" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-3.5 py-2 rounded-xl transition">🏠 Phát Lệnh</a>
        <a href="/analytics.html" data-i18n="nav_analytics" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-3.5 py-2 rounded-xl transition">📈 Phân Tích & APS</a>
      </div>
    </div>

    <!-- Khối Quét Mã QR Thẻ Công Đoạn -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
      <h2 data-i18n="card_scan_qr" class="text-base font-bold text-white border-b border-slate-800 pb-3">📷 Quét Thẻ Công Đoạn</h2>
      <div class="flex gap-2">
        <input type="text" id="ticketInput" data-i18n="lbl_scan_input" placeholder="Nhập mã thẻ hoặc Quét mã QR..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-cyan-500 font-mono text-sm">
        <button onclick="scanTicket()" data-i18n="btn_scan_action" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black px-6 rounded-xl transition text-sm">🔍 Quét</button>
      </div>
    </div>

    <!-- Chi tiết công đoạn & Bảng thao tác chạy máy -->
    <div id="operatorActionCard" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
      <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
        <div>
          <span class="text-xs text-slate-400">Mã Lệnh: <b id="disp_wo" class="text-cyan-400 font-mono"></b></span>
          <h3 id="disp_op" class="text-lg font-black text-white"></h3>
          <p id="disp_prod" class="text-xs text-slate-300"></p>
        </div>
        <span id="disp_target" class="text-base font-black bg-slate-950 border border-slate-700 px-3 py-1.5 rounded-xl text-yellow-300 font-mono">500 PCS</span>
      </div>

      <!-- Thiết lập chạy máy -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
        <div>
          <label data-i18n="lbl_machine_select" class="block text-slate-400 mb-1">Chọn Máy Gia Công</label>
          <select id="sel_machine" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white outline-none"></select>
        </div>
        <div>
          <label data-i18n="lbl_operator_code" class="block text-slate-400 mb-1">Mã Công Nhân</label>
          <input type="text" id="inp_operator" value="NV-088" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white outline-none font-mono font-bold">
        </div>
      </div>

      <!-- Nút Start -->
      <button onclick="startJob()" id="btnStart" data-i18n="btn_start_job" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl transition text-sm">
        ▶ BẮT ĐẦU GIA CÔNG
      </button>

      <!-- Khối Nhập Hoàn Thành -->
      <div id="finishSection" class="hidden space-y-4 border-t border-slate-800 pt-4 text-xs">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label data-i18n="lbl_good_qty" class="block text-emerald-400 font-bold mb-1">SL ĐẠT (OK)</label>
            <input type="number" id="inp_good" value="490" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-emerald-300 font-mono font-black text-base outline-none">
          </div>
          <div>
            <label data-i18n="lbl_scrap_qty" class="block text-rose-400 font-bold mb-1">SL HỎNG (NG)</label>
            <input type="number" id="inp_scrap" value="10" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-rose-300 font-mono font-black text-base outline-none">
          </div>
        </div>

        <div>
          <label data-i18n="lbl_defect_select" class="block text-slate-400 mb-1">Mã Lỗi Phát Sinh (Nếu có)</label>
          <select id="sel_defect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white outline-none">
            <option value="DEF_STAMP_BURR">DEF_STAMP_BURR - Ba via dập vượt tiêu chuẩn</option>
            <option value="DEF_CNC_DIM">DEF_CNC_DIM - Sai dung sai kích thước CNC</option>
            <option value="DEF_WELD_POROSITY">DEF_WELD_POROSITY - Rỗ khí mối hàn</option>
            <option value="DEF_PAINT_PEEL">DEF_PAINT_PEEL - Bong tróc màng sơn</option>
          </select>
        </div>

        <button onclick="finishJob()" data-i18n="btn_finish_job" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-xl transition text-sm">
          ■ HOÀN THÀNH & LƯU
        </button>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = '/api';
    let currentTicket = null;
    let currentLogId = null;

    function handleLangSwitch(lang) {
      setLanguage(lang);
      loadMachines();
      if (currentTicket) {
        document.getElementById('disp_op').innerText = t(`Bước ${currentTicket.step_order} - ${currentTicket.operation_name}`);
        document.getElementById('disp_prod').innerText = `${currentTicket.product_id} - ${t(currentTicket.product_name)}`;
      }
    }

    async function loadMachines() {
      try {
        const res = await fetch(`${API_BASE}/machines`);
        const result = await res.json();
        const select = document.getElementById('sel_machine');
        select.innerHTML = '';
        if (result.data) {
          result.data.forEach(m => {
            select.innerHTML += `<option value="${m.machine_id}">${m.machine_id} - ${t(m.machine_name)} (${t(m.department)})</option>`;
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function scanTicket() {
      const ticketId = document.getElementById('ticketInput').value.trim();
      if (!ticketId) return alert('Vui lòng nhập mã thẻ!');

      try {
        const res = await fetch(`${API_BASE}/shopfloor/scan/${ticketId}`);
        const result = await res.json();
        if (result.success) {
          currentTicket = result.data;
          document.getElementById('disp_wo').innerText = currentTicket.wo_id;
          document.getElementById('disp_op').innerText = t(`Bước ${currentTicket.step_order} - ${currentTicket.operation_name}`);
          document.getElementById('disp_prod').innerText = `${currentTicket.product_id} - ${t(currentTicket.product_name)}`;
          document.getElementById('disp_target').innerText = `${currentTicket.target_qty} PCS`;
          document.getElementById('operatorActionCard').classList.remove('hidden');
        } else {
          alert('Không tìm thấy thông tin thẻ!');
        }
      } catch (e) {
        alert('Lỗi kết nối máy chủ!');
      }
    }

    async function startJob() {
      const body = {
        ticket_id: currentTicket.ticket_id,
        machine_id: document.getElementById('sel_machine').value,
        operator_code: document.getElementById('inp_operator').value
      };

      const res = await fetch(`${API_BASE}/shopfloor/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const result = await res.json();
      if (result.success) {
        currentLogId = result.log_id;
        document.getElementById('btnStart').classList.add('hidden');
        document.getElementById('finishSection').classList.remove('hidden');
        alert('Máy đã chuyển sang trạng thái RUNNING. Chúc ca làm việc an toàn!');
      }
    }

    async function finishJob() {
      const body = {
        ticket_id: currentTicket.ticket_id,
        log_id: currentLogId,
        good_qty: document.getElementById('inp_good').value,
        scrap_qty: document.getElementById('inp_scrap').value,
        defect_id: document.getElementById('sel_defect').value
      };

      const res = await fetch(`${API_BASE}/shopfloor/finish`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const result = await res.json();
      if (result.success) {
        alert(result.message);
        location.reload();
      }
    }

    loadMachines();
  </script>
</body>
</html>
